<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Contas Minecraft by danony</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 { text-align: center; color: #56a85a; margin: 0; }
        .creator-name {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            animation: rgb-animation 4s linear infinite;
            margin: -5px 0 0 0;
        }
        @keyframes rgb-animation {
            0% { color: #ff0000; } 15% { color: #ff7f00; } 30% { color: #ffff00; }
            45% { color: #00ff00; } 60% { color: #00ffff; } 75% { color: #0000ff; }
            90% { color: #8b00ff; } 100% { color: #ff0000; }
        }
        p { text-align: center; margin: 0; color: #999; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #ccc; }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #d4d4d4;
            font-family: monospace; /* Melhor para ler dados */
            font-size: 14px;
            resize: vertical;
            min-height: 200px;
        }
        textarea:focus { outline: none; border-color: #56a85a; box-shadow: 0 0 8px #56a85a66; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.3s;
            flex-grow: 1;
        }
        button:hover { opacity: 0.9; }
        #extractButton { background-color: #56a85a; }
        #copyButton { background-color: #3e85c9; }
        #clearButton { background-color: #c93e3e; flex-grow: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Extrator de Contas Minecraft</h1>
        <h2 class="creator-name">danony</h2>
        <p>Extrai apenas "email:senha" ignorando colchetes e outros textos.</p>
        
        <div class="input-group">
            <label for="inputText">Cole sua lista aqui:</label>
            <textarea id="inputText" placeholder="Exemplo: [Minecraft][email@gmail.com:senha123][Banido]"></textarea>
        </div>

        <div class="button-group">
            <button id="extractButton">Extrair Contas</button>
            <button id="copyButton">Copiar Saída</button>
            <button id="clearButton">Limpar</button>
        </div>

        <div class="input-group">
            <label for="outputText">Resultado Limpo:</label>
            <textarea id="outputText" readonly placeholder="O resultado aparecerá aqui..."></textarea>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const extractButton = document.getElementById('extractButton');
            const copyButton = document.getElementById('copyButton');
            const clearButton = document.getElementById('clearButton');
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');

            // REGEX CORRIGIDA:
            // Adicionado "\]" na lista de exclusão para não pegar o colchete final da linha
            const credencialRegex = /[\w\.\-]+@[\w\.\-]+\.[a-zA-Z]{2,}:[^:\s\[\]\|]+/g;

            extractButton.addEventListener('click', function() {
                const text = inputText.value;
                if (!text) return;

                const matches = text.match(credencialRegex);

                if (matches && matches.length > 0) {
                    // Remove duplicatas (opcional, mas útil) e junta
                    const uniqueMatches = [...new Set(matches)];
                    outputText.value = uniqueMatches.join('\n');
                    alert(`Sucesso! ${uniqueMatches.length} contas extraídas.`);
                } else {
                    outputText.value = 'Nenhuma conta no formato email:senha encontrada.';
                }
            });

            copyButton.addEventListener('click', function() {
                const textToCopy = outputText.value;
                if (!textToCopy) return;

                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = copyButton.textContent;
                    copyButton.textContent = 'Copiado!';
                    setTimeout(() => copyButton.textContent = originalText, 2000);
                });
            });

            clearButton.addEventListener('click', function() {
                inputText.value = '';
                outputText.value = '';
            });
        });
    </script>
</body>
</html>
